# Builds Windows, macOS and Linux releases when a version tag (v1.2.3) is pushed.
#
# Release assets:
#   otscreator-amd64-installer.exe  NSIS installer for first installs
#   otscreator-windows-amd64.exe    plain executable, used by the in-app updater
#   otscreator-darwin-arm64.zip     .app bundle for Apple Silicon Macs
#   otscreator-darwin-amd64.zip     .app bundle for Intel Macs
#   otscreator-linux-amd64.AppImage portable Linux app, used by the in-app updater
#   otscreator-linux-arm64.AppImage
#   otscreator_<version>_amd64.deb  packages for Debian/Ubuntu and Fedora/RHEL
#   otscreator_<version>_arm64.deb  (no "linux" in the name, so the updater
#   otscreator-<version>.x86_64.rpm  skips them)
#   otscreator-<version>.aarch64.rpm
#   checksums.txt                   SHA-256 of all of them, checked by the updater
#
# The in-app updater (Wails updater, GitHub provider) picks the asset whose name
# contains the running OS and architecture and skips "-installer." assets. On
# macOS it needs a .zip with exactly one top-level .app (no .dmg). On Linux it
# replaces the AppImage file it runs from.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  WAILS_VERSION: v3.0.0

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Version from tag
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          # Windows resources and NSIS need plain x.y.z.
          numeric="${version%%[-+]*}"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "NUMERIC_VERSION=$numeric" >> "$GITHUB_ENV"
          sed -i "s/\"0\.1\.0\"/\"$numeric\"/g" build/windows/info.json

      - name: Install tools
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@$WAILS_VERSION
          if ! command -v makensis >/dev/null; then choco install nsis -y --no-progress; fi
          echo "C:/Program Files (x86)/NSIS" >> "$GITHUB_PATH"

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Test
        run: |
          wails3 task common:generate:bindings
          # main.go embeds frontend/dist, which exists only after the frontend build.
          mkdir -p frontend/dist && touch frontend/dist/.keep
          go test ./...
          cd frontend && npx prettier --check . && npx vitest run && npx svelte-check --threshold error

      - name: Build installer
        run: wails3 task windows:package VERSION="$VERSION" INSTALLER_VERSION="$NUMERIC_VERSION"

      - name: Collect assets
        run: |
          mkdir dist
          cp bin/otscreator.exe dist/otscreator-windows-amd64.exe
          cp bin/otscreator-amd64-installer.exe dist/

      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: dist/*
          if-no-files-found: error

  macos:
    # Apple Silicon runner; the amd64 build is cross-compiled with the same
    # toolchain (Go passes -arch x86_64 to clang for cgo).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Version from tag
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          # CFBundleShortVersionString / CFBundleVersion need plain x.y.z.
          numeric="${version%%[-+]*}"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          sed -i '' "s|<string>0\.1\.0</string>|<string>$numeric</string>|g" build/darwin/Info.plist
          grep -c "<string>$numeric</string>" build/darwin/Info.plist

      - name: Install tools
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@$WAILS_VERSION

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Test
        run: |
          wails3 task common:generate:bindings
          # main.go embeds frontend/dist, which exists only after the frontend build.
          mkdir -p frontend/dist && touch frontend/dist/.keep
          go test ./...

      - name: Build app bundles
        run: |
          mkdir dist
          for arch in arm64 amd64; do
            # Builds bin/otscreator.app (ad-hoc signed by create:app:bundle).
            wails3 task darwin:package ARCH="$arch" VERSION="$VERSION"
            lipo -info bin/otscreator.app/Contents/MacOS/otscreator
            codesign --verify --deep --strict bin/otscreator.app
            # One top-level .app per zip, as the updater expects.
            ditto -c -k --norsrc --keepParent bin/otscreator.app "dist/otscreator-darwin-$arch.zip"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: dist/*
          if-no-files-found: error

  linux:
    # Native runners for both architectures: cgo needs the GTK and WebKit
    # libraries of the target, and the AppImage bundles the runner's copies.
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Version from tag
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          # deb and rpm versions cannot hold "-", so a pre-release keeps only x.y.z.
          numeric="${version%%[-+]*}"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "NUMERIC_VERSION=$numeric" >> "$GITHUB_ENV"
          sed -i "s/^version: \"0\.1\.0\"/version: \"$numeric\"/" build/linux/nfpm/nfpm.yaml
          grep -c "^version: \"$numeric\"" build/linux/nfpm/nfpm.yaml

      - name: Install system packages
        run: |
          sudo apt-get update
          # GTK 4 and WebKitGTK 6.0 for cgo; file and desktop-file-utils for linuxdeploy.
          sudo apt-get install -y --no-install-recommends             build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev             file desktop-file-utils

      - name: Install tools
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@$WAILS_VERSION

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Test
        run: |
          wails3 task common:generate:bindings
          # main.go embeds frontend/dist, which exists only after the frontend build.
          mkdir -p frontend/dist && touch frontend/dist/.keep
          go test ./...

      - name: Build packages
        run: wails3 task linux:package ARCH="${{ matrix.arch }}" VERSION="$VERSION"

      - name: Collect assets
        run: |
          mkdir dist
          ls -l bin
          case "${{ matrix.arch }}" in
            amd64) appimage_arch=x86_64; rpm_arch=x86_64 ;;
            arm64) appimage_arch=aarch64; rpm_arch=aarch64 ;;
          esac
          cp "bin/otscreator-$appimage_arch.AppImage" "dist/otscreator-linux-${{ matrix.arch }}.AppImage"
          chmod +x dist/*.AppImage
          cp bin/otscreator.deb "dist/otscreator_${NUMERIC_VERSION}_${{ matrix.arch }}.deb"
          cp bin/otscreator.rpm "dist/otscreator-${NUMERIC_VERSION}.$rpm_arch.rpm"

      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    steps:
      # Full history and tags, for the commit list in the release notes.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist && sha256sum * > checksums.txt
          cat checksums.txt

      - name: Release notes
        run: |
          # Commits since the previous version tag (all commits for the first one).
          prev="$(git describe --tags --abbrev=0 --match 'v*' "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          range="$GITHUB_REF_NAME"
          if [ -n "$prev" ]; then range="$prev..$GITHUB_REF_NAME"; fi
          git log "$range" --no-merges --pretty='- %s (%h)' > notes.md
          if [ ! -s notes.md ]; then echo "No changes." > notes.md; fi
          cat notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          prerelease=""
          if [ "$version" != "${version%%[-+]*}" ]; then prerelease="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "OTS Creator $version" --notes-file notes.md $prerelease
