# Package definition for the deb and rpm packages (wails3 tool package).
# See https://nfpm.goreleaser.com. The release workflow replaces the version.

name: "otscreator"
arch: ${GOARCH}
platform: "linux"
version: "0.1.0"
section: "default"
priority: "extra"
maintainer: "nekiro"
description: "Object editor for Open Tibia clients"
vendor: "nekiro"
homepage: "https://github.com/nekiro/ots-creator"
license: "Apache-2.0 WITH Commons-Clause"
release: "1"

contents:
  - src: "./bin/otscreator"
    dst: "/usr/bin/otscreator"
  # appicon.png is 1024x1024, larger than the hicolor theme's sizes.
  - src: "./build/appicon.png"
    dst: "/usr/share/pixmaps/otscreator.png"
  - src: "./build/linux/otscreator.desktop"
    dst: "/usr/share/applications/otscreator.desktop"

# Default dependencies for the GTK4 + WebKitGTK 6.0 stack (Ubuntu 24.04+ / Debian 13+)
depends:
  - libgtk-4-1
  - libwebkitgtk-6.0-4

# Distribution-specific overrides for different package formats
overrides:
  # RPM packages for Fedora / RHEL / AlmaLinux / Rocky Linux
  rpm:
    depends:
      - gtk4
      - webkitgtk6.0

  # Arch Linux packages
  archlinux:
    depends:
      - gtk4
      - webkitgtk-6.0

# scripts section to ensure desktop database is updated after install
scripts:
  postinstall: "./build/linux/nfpm/scripts/postinstall.sh"
  # You can also add preremove, postremove if needed
  # preremove: "./build/linux/nfpm/scripts/preremove.sh"
  # postremove: "./build/linux/nfpm/scripts/postremove.sh"

# If you build your app with -tags gtk3 (legacy WebKit2GTK 4.1 stack - supported through v3.0.x, removed in v3.1),
# replace the depends/overrides above with these:
#
# depends:
#   - libgtk-3-0
#   - libwebkit2gtk-4.1-0
# overrides:
#   rpm:
#     depends:
#       - gtk3
#       - webkit2gtk4.1
#   archlinux:
#     depends:
#       - gtk3
#       - webkit2gtk-4.1
#
# replaces:
#   - foobar
# provides:
#   - bar
# recommends:
#   - whatever
# suggests:
#   - something-else
# conflicts:
#   - not-foo
#   - not-bar
# changelog: "changelog.yaml"
